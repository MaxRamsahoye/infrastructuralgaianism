<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructural Gaianism</title>
<style>
  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-RomanLF.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-DisplayItalic.woff2") format("woff2");
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-SemiBoldOSF.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f5f2ec;
    --fg: #1a1a17;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
  }

  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    background-image: url("images/hero-background.jpg");
    background-size: cover;
    /* Aligns this exact point of the image (the cloud's safe interior
       center) with the same point of the viewport, at any aspect ratio. */
    background-position: 48.25% 24.65%;
    background-repeat: no-repeat;
  }

  .hero h1 {
    position: absolute;
    left: 48.25%;
    top: 24.65%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-family: "ET Bembo", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(1.5rem, 3.6vw, 3.4rem);
    line-height: 1.15;
    letter-spacing: 0.01em;
    max-width: min(680px, 38vw);
  }
</style>
</head>
<body>

  <section class="hero">
    <h1>Infrastructural Gaianism</h1>
  </section>

</body>
</html>
