<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructural Gaianism</title>
<style>
  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-RomanLF.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-DisplayItalic.woff2") format("woff2");
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-SemiBoldOSF.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f5f2ec;
    --fg: #1a1a17;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
  }

  .hero {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 5vw;
  }

  .hero h1 {
    font-family: "ET Bembo", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(2.5rem, 8vw, 7rem);
    line-height: 1.1;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

  <section class="hero">
    <h1>Infrastructural Gaianism</h1>
  </section>

</body>
</html>
