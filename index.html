<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructural Gaianism</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="images/favicon-16.png" sizes="16x16" type="image/png">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<style>
  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-RomanLF.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-DisplayItalic.woff2") format("woff2");
    font-weight: 400;
    font-style: italic;
    font-display: swap;
  }

  @font-face {
    font-family: "ET Bembo";
    src: url("fonts/ETBembo-SemiBoldOSF.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f5f2ec;
    --fg: #1a1a17;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
  }

  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    background-image: url("images/hero-background.jpg");
    background-size: cover;
    /* Aligns this exact point of the image (the cloud's safe interior
       center) with the same point of the viewport, at any aspect ratio. */
    background-position: 48.25% 28%;
    background-repeat: no-repeat;
  }

  .hero-content {
    position: absolute;
    left: 48.25%;
    top: 28%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: min(680px, 40vw);
  }

  .hero h1 {
    font-family: "ET Bembo", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(1.5rem, 3.6vw, 3.4rem);
    line-height: 1.15;
    letter-spacing: 0.01em;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.7);
  }

  .hero-description {
    margin-top: 0.9em;
    font-family: "ET Bembo", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.05rem, 1.5vw, 1.45rem);
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: #3a3a34;
    text-shadow: 0 0 24px rgba(255, 255, 255, 0.8), 0 0 10px rgba(255, 255, 255, 0.9);
  }

  .scroll-arrow {
    margin-top: 3em;
    display: inline-flex;
    color: var(--fg);
    opacity: 0.75;
    filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.85));
    animation: hero-arrow-bob 2.4s ease-in-out infinite;
    text-decoration: none;
  }

  .scroll-arrow:hover {
    opacity: 1;
  }

  .scroll-arrow svg {
    width: clamp(14px, 1.4vw, 18px);
    height: clamp(14px, 1.4vw, 18px);
    display: block;
  }

  @keyframes hero-arrow-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }

  .article {
    min-height: 100vh;
    width: 100%;
  }
</style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <h1>Infrastructural Gaianism</h1>
      <p class="hero-description">
        A systems-change philosophy advocating for the complete redesign
        of society&rsquo;s foundational technical and economic
        infrastructure in alignment with sustainability principles.
      </p>
      <a class="scroll-arrow" href="#article" aria-label="Scroll to article">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4 L12 21 L20 4 M4 4 L12 8.5 L20 4 M12 8.5 L12 21" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </section>

  <section id="article" class="article">
  </section>

</body>
</html>
